<!-- Google Apps Script for the sync sheet (Code.gs) – shown in Settings → Google Sheets sync -->
<script type="text/plain" id="gsCode">
/**
 * Sports Corner · Price Change Tracker – Google Sheets sync
 * Paste this into Extensions → Apps Script of your Google Sheet,
 * then Deploy → New deployment → Web app
 *   Execute as: Me      Who has access: Anyone
 * Copy the Web app URL (ends with /exec) into the tracker: Settings → Google Sheets sync.
 */
const KEY = '';   // optional sync PIN – if you set one here, type the same PIN in the tracker

const TABS = { price: 'Price list', soh: 'Stock SOH', master: 'Product master', alias: 'Master barcodes' };
const META = '_sync';

function doGet() {
  return out({ ok: true, app: 'scpc-sync', msg: 'Price tracker sync is running. Paste this URL into the tracker.' });
}

function doPost(e) {
  try {
    const p = JSON.parse(e.postData.contents);
    if (KEY && String(p.key || '') !== KEY) return out({ ok: false, error: 'Wrong sync PIN' });
    const ss = SpreadsheetApp.getActiveSpreadsheet();

    if (p.action === 'status') {
      const m = readMeta(ss);
      return out({ ok: true, app: 'scpc-sync', meta: { price: m.price || null, soh: m.soh || null, master: m.master || null }, state: m.state || null });
    }
    if (p.action === 'read') {
      const sh = ss.getSheetByName(TABS[p.target]);
      if (!sh) return out({ ok: false, error: 'Tab "' + TABS[p.target] + '" not found' });
      const last = sh.getLastRow() - 1;                       // data rows (row 1 = headers)
      const n = Math.min(p.limit, last - p.offset);
      const rows = n > 0 ? sh.getRange(p.offset + 2, 1, n, p.cols).getValues() : [];
      return out({ ok: true, rows: rows });
    }

    const lock = LockService.getScriptLock();
    lock.waitLock(60000);
    try {
      ensureMeta(ss);
      switch (p.action) {
        case 'begin':     return out(begin(ss, p));
        case 'chunk':     return out(chunk(ss, p));
        case 'commit':    return out(commit(ss, p));
        case 'remove':    return out(remove(ss, p));
        case 'saveState': return out(saveState(ss, p));
      }
      return out({ ok: false, error: 'Unknown action ' + p.action });
    } finally {
      SpreadsheetApp.flush();
      lock.releaseLock();
    }
  } catch (err) {
    return out({ ok: false, error: String((err && err.message) || err) });
  }
}

/* ---------- uploads go to a temporary tab, swapped in on commit ---------- */
function tmpName(p, target) { return '_up_' + target + '_' + p.id; }

function begin(ss, p) {
  // tidy up abandoned uploads older than 1 hour
  ss.getSheets().forEach(function (s) {
    const m = s.getName().match(/^_up_\w+_(\d+)$/);
    if (m && Date.now() - Number(m[1]) > 3600000) ss.deleteSheet(s);
  });
  const name = tmpName(p, p.target);
  const old = ss.getSheetByName(name);
  if (old) ss.deleteSheet(old);
  const sh = ss.insertSheet(name);
  const rows = Math.max(2, p.rows + 1), cols = Math.max(1, p.cols);
  const mr = sh.getMaxRows(), mc = sh.getMaxColumns();
  if (rows > mr) sh.insertRowsAfter(mr, rows - mr); else if (rows < mr) sh.deleteRows(rows + 1, mr - rows);
  if (cols > mc) sh.insertColumnsAfter(mc, cols - mc); else if (cols < mc) sh.deleteColumns(cols + 1, mc - cols);
  sh.getRange(1, 1, rows, cols).setNumberFormat('@');      // keep barcodes / leading zeros as text
  sh.getRange(1, 1, 1, cols).setValues([pad(p.headers || [], cols)]).setFontWeight('bold');
  sh.setFrozenRows(1);
  return { ok: true };
}

function chunk(ss, p) {
  const sh = ss.getSheetByName(tmpName(p, p.target));
  if (!sh) return { ok: false, error: 'Upload expired – please sync again' };
  if (p.rows.length) sh.getRange(p.start + 2, 1, p.rows.length, p.cols).setValues(p.rows.map(function (r) { return pad(r, p.cols); }));
  return { ok: true };
}

function commit(ss, p) {
  const meta = readMeta(ss);
  for (const t of p.targets) {
    const tmp = ss.getSheetByName(tmpName(p, t));
    if (!tmp) {
      if (meta[p.kind] && meta[p.kind].at === p.meta.at) return { ok: true };   // already committed (retry)
      return { ok: false, error: 'Upload expired – please sync again' };
    }
  }
  for (const t of p.targets) {
    const old = ss.getSheetByName(TABS[t]);
    if (old) ss.deleteSheet(old);
    ss.getSheetByName(tmpName(p, t)).setName(TABS[t]);
  }
  setMeta(ss, p.kind, p.meta);
  return { ok: true };
}

function remove(ss, p) {
  const list = p.kind === 'master' ? ['master', 'alias'] : [p.kind];
  list.forEach(function (t) { const s = ss.getSheetByName(TABS[t]); if (s) ss.deleteSheet(s); });
  setMeta(ss, p.kind, { removed: true, at: p.at });
  return { ok: true };
}

function saveState(ss, p) {
  const cur = readMeta(ss).state;
  if (cur && cur.at > p.state.at) return { ok: true, state: cur };   // a newer copy is already saved
  setMeta(ss, 'state', p.state);
  return { ok: true };
}

/* ---------- helpers ---------- */
function ensureMeta(ss) {
  let sh = ss.getSheetByName(META);
  if (!sh) {
    sh = ss.insertSheet(META);
    sh.getRange(1, 1, 1, 2).setValues([['key', 'value (managed by the tracker – do not edit)']]).setFontWeight('bold');
    sh.getRange('A:B').setNumberFormat('@');
  }
  return sh;
}
function readMeta(ss) {
  const sh = ss.getSheetByName(META), o = {};
  if (!sh || sh.getLastRow() < 2) return o;
  sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues().forEach(function (r) {
    if (r[0]) { try { o[r[0]] = JSON.parse(r[1]); } catch (e) {} }
  });
  return o;
}
function setMeta(ss, key, val) {
  const sh = ensureMeta(ss);
  const n = Math.max(0, sh.getLastRow() - 1);
  const keys = n ? sh.getRange(2, 1, n, 1).getValues().map(function (r) { return r[0]; }) : [];
  const i = keys.indexOf(key);
  const row = i >= 0 ? i + 2 : n + 2;
  sh.getRange(row, 1, 1, 2).setValues([[key, JSON.stringify(val)]]);
}
function pad(r, n) {
  const o = new Array(n);
  for (let j = 0; j < n; j++) { const v = r[j]; o[j] = v == null ? '' : v; }
  return o;
}
function out(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
</script>

<script>
/* ===== Minimal XLSX / XLSB reader (no dependencies) ===== */
async function zipEntries(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = u8.length - 22;
  while(e >= 0 && dv.getUint32(e,true) !== 0x06054b50) e--;
  if(e < 0) throw new Error('Not a valid Excel file (zip header not found)');
  const n = dv.getUint16(e+10,true); let p = dv.getUint32(e+16,true);
  const td = new TextDecoder(); const files = {};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true);
    const nl = dv.getUint16(p+28,true), xl = dv.getUint16(p+30,true), cl = dv.getUint16(p+32,true);
    const off = dv.getUint32(p+42,true);
    const name = td.decode(u8.subarray(p+46,p+46+nl));
    files[name] = {method, csize, off};
    p += 46+nl+xl+cl;
  }
  async function get(name){
    const f = files[name]; if(!f) return null;
    const lnl = dv.getUint16(f.off+26,true), lxl = dv.getUint16(f.off+28,true);
    const start = f.off+30+lnl+lxl; const data = u8.subarray(start,start+f.csize);
    if(f.method===0) return data;
    const ds = new DecompressionStream('deflate-raw');
    const out = new Blob([data]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(out).arrayBuffer());
  }
  return {names:Object.keys(files), get};
}
function xmlDecode(s){return s.indexOf('&')<0?s:s.replace(/&(#x([0-9a-fA-F]+)|#(\d+)|amp|lt|gt|quot|apos);/g,(m,a,h,d)=>h?String.fromCodePoint(parseInt(h,16)):d?String.fromCodePoint(+d):({amp:'&',lt:'<',gt:'>',quot:'"',apos:"'"})[a]);}
function colIdx(ref){let c=0;for(let i=0;i<ref.length;i++){const k=ref.charCodeAt(i);if(k<65)break;c=c*26+(k-64);}return c-1;}
function parseXlsxSheet(xml, sst){
  const rows=[]; const td=xml; let m; const rowRe=/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g; let rn=0;
  const rAttr=/\br="(\d+)"/;
  while((m=rowRe.exec(td))){
    const head=m[0].slice(0,m[0].indexOf('>')); const ra=rAttr.exec(head); const r=ra?+ra[1]-1:rn; rn=r+1;
    if(!m[1]) continue; const arr=[]; const cre=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let c;
    while((c=cre.exec(m[1]))){
      const at=c[1]; const ref=/\br="([A-Z]+)\d+"/.exec(at); if(!ref||!c[2]) continue; const t=/\bt="(\w+)"/.exec(at); const ty=t?t[1]:'n';
      let val=null;
      if(ty==='inlineStr'){const ts=c[2].match(/<t[^>]*>([\s\S]*?)<\/t>/g); val=ts?ts.map(x=>xmlDecode(x.replace(/<[^>]+>/g,''))).join(''):'';}
      else{const v=/<v>([\s\S]*?)<\/v>/.exec(c[2]); if(!v) continue; const s=v[1];
        if(ty==='s') val=sst[+s]; else if(ty==='str'||ty==='e') val=xmlDecode(s); else if(ty==='b') val=s==='1'; else val=+s;}
      arr[colIdx(ref[1])]=val;
    }
    rows[r]=arr;
  }
  return rows;
}
async function readXlsx(zip){
  const td=new TextDecoder(); const wb=td.decode(await zip.get('xl/workbook.xml')); const rels=td.decode(await zip.get('xl/_rels/workbook.xml.rels'));
  const relMap={}; for(const m of rels.matchAll(/<Relationship\b[^>]*>/g)){const id=/\bId="([^"]+)"/.exec(m[0]),t=/\bTarget="([^"]+)"/.exec(m[0]); if(id&&t) relMap[id[1]]=t[1];}
  let sst=[]; const sx=await zip.get('xl/sharedStrings.xml');
  if(sx){const x=td.decode(sx); for(const m of x.matchAll(/<si\b[^>]*?(?:\/>|>([\s\S]*?)<\/si>)/g)){const ts=m[1]?m[1].match(/<t\b[^>]*>([\s\S]*?)<\/t>/g):null; sst.push(ts?xmlDecode(ts.map(x=>x.replace(/<[^>]+>/g,'')).join('')):'');}}
  const out={};
  for(const m of wb.matchAll(/<sheet\b[^>]*>/g)){
    const nm=/\bname="([^"]*)"/.exec(m[0]), rid=/\br:id="([^"]+)"/.exec(m[0]); if(!nm||!rid) continue;
    let tg=relMap[rid[1]]; if(!tg) continue; tg=tg.replace(/^\//,''); if(!tg.startsWith('xl/')) tg='xl/'+tg;
    const d=await zip.get(tg); if(!d) continue; out[xmlDecode(nm[1])]=parseXlsxSheet(td.decode(d), sst);
  }
  return out;
}
/* ---- XLSB (BIFF12) ---- */
function* biffRecords(u8){
  let p=0; const n=u8.length;
  while(p<n){
    let id=u8[p++]; if(id&0x80) id=(id&0x7F)|((u8[p++]&0x7F)<<7);
    let len=0; for(let i=0;i<4;i++){const b=u8[p++]; len|=(b&0x7F)<<(7*i); if(b<0x80) break;}
    yield [id,p,len]; p+=len;
  }
}
const _u16=new TextDecoder('utf-16le');
function wideStr(u8,dv,p){const l=dv.getUint32(p,true); return [ _u16.decode(u8.subarray(p+4,p+4+2*l)), p+4+2*l ];}
function rkVal(rk){
  let v; if(rk&2) v=rk>>2; else {const b=new DataView(new ArrayBuffer(8)); b.setUint32(4,rk&0xFFFFFFFC,true); b.setUint32(0,0,true); v=b.getFloat64(0,true);}
  return (rk&1)? v/100 : v;
}
async function readXlsb(zip){
  const td=new TextDecoder(); const rels=td.decode(await zip.get('xl/_rels/workbook.bin.rels'));
  const relMap={}; for(const m of rels.matchAll(/<Relationship\b[^>]*>/g)){const id=/\bId="([^"]+)"/.exec(m[0]),t=/\bTarget="([^"]+)"/.exec(m[0]); if(id&&t) relMap[id[1]]=t[1];}
  const wbb=await zip.get('xl/workbook.bin'); const wdv=new DataView(wbb.buffer,wbb.byteOffset,wbb.byteLength); const sheets=[];
  for(const [id,p] of biffRecords(wbb)){ if(id===156){ let [rid,q]=wideStr(wbb,wdv,p+8); let [name]=wideStr(wbb,wdv,q); sheets.push([name,rid]); } }
  const sst=[]; const sb=await zip.get('xl/sharedStrings.bin');
  if(sb){const dv=new DataView(sb.buffer,sb.byteOffset,sb.byteLength); for(const [id,p] of biffRecords(sb)){ if(id===19) sst.push(wideStr(sb,dv,p+1)[0]); }}
  const out={};
  for(const [name,rid] of sheets){
    let tg=relMap[rid]; if(!tg) continue; tg=tg.replace(/^\//,''); if(!tg.startsWith('xl/')) tg='xl/'+tg;
    const d=await zip.get(tg); if(!d) continue; const dv=new DataView(d.buffer,d.byteOffset,d.byteLength);
    const rows=[]; let cur=null;
    for(const [id,p] of biffRecords(d)){
      if(id===0){ const r=dv.getUint32(p,true); cur=rows[r]=[]; continue; }
      if(id<1||id>11||!cur) continue;
      const c=dv.getUint32(p,true); let v;
      switch(id){
        case 1: continue;
        case 2: v=rkVal(dv.getUint32(p+8,true)); break;
        case 3: v=null; break;
        case 4: v=!!d[p+8]; break;
        case 5: v=dv.getFloat64(p+8,true); break;
        case 6: case 8: v=wideStr(d,dv,p+8)[0]; break;
        case 7: v=sst[dv.getUint32(p+8,true)]; break;
        case 9: v=dv.getFloat64(p+8,true); break;
        case 10: v=!!d[p+8]; break;
        default: v=null;
      }
      cur[c]=v;
    }
    out[name]=rows;
  }
  return out;
}
async function readWorkbook(buf){
  const zip=await zipEntries(buf);
  if(zip.names.includes('xl/workbook.bin')) return await readXlsb(zip);
  if(zip.names.includes('xl/workbook.xml')) return await readXlsx(zip);
  throw new Error('Unsupported file. Please upload .xlsx or .xlsb');
}

<script>

/* ================== settings & schema ================== */

 price:{title:'Price list (WAS / NOW)',fields:[
  ['art','Article code *',/barcode|article|sku|style|code/i],['was','WAS price *',/sales price|before|\bwas\b/i],['now','NOW price *',/discounted|\bnow\b|after/i],['desc','Description',/description/i],['brand','Brand',/trade ?mark|brand/i]]},

  ['article','Article (matches price list) *',/search name|article/i],['barcode','UPC / Barcode *',/^barcode/i],['qty','Quantity *',/^physical inventory/i],['size','Size',/^size/i],['variant','Variant number',/variant/i],['wh','Store / Warehouse',/^warehouse/i],['brand','Brand',/^brand/i],['name','Product name',/product name/i]]},
 master:{title:'Product master',fields:[
  ['variant','Variant number *',/^variant number$/i],['barcode','Barcode',/^barcode$/i],['article','Search name (article)',/search name/i],['gender','Gender *',/^gender$/i],['division','Division source *',/^item group$/i]]}
};
const DEF={store:'SCOGMR01',includeZero:false,genderGroup:true,currency:'QAR',decimals:0,

/* ================== Google Sheets sync ================== */
// Optional: paste your Web app URL (and PIN) here once, then copy this HTML file to every PDT / desktop –
// they will all be set up automatically. You can also enter it in Settings → Google Sheets sync.
const SYNC_DEFAULT_URL='';
const SYNC_DEFAULT_KEY='';
// The Google Apps Script (Code.gs) for the Google Sheet is stored at the bottom of this file in <script id="gsCode">.
const KINDS=['price','soh','master'];
const gsText=()=>{const e=document.getElementById('gsCode');return e?e.textContent.trim():'';};
let SY=Object.assign({url:SYNC_DEFAULT_URL,key:SYNC_DEFAULT_KEY,auto:true},ls.get('scpc.sync',{}));
if(!SY.url&&SYNC_DEFAULT_URL){SY.url=SYNC_DEFAULT_URL;SY.key=SY.key||SYNC_DEFAULT_KEY;}
let stateAt=ls.get('scpc.stateAt',0);
const SYS={busy:false,msg:'',kind:'',last:ls.get('scpc.lastSync',0)};
const saveSY=()=>ls.set('scpc.sync',SY);
const syncOn=()=>/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(S(SY.url));
const KNAME={price:'price list',soh:'stock (SOH)',master:'product master',alias:'master barcodes'};

function markState(){
  stateAt=Date.now();ls.set('scpc.stateAt',stateAt);
  if(syncOn()&&SY.auto){clearTimeout(window._ps);window._ps=setTimeout(()=>{if(!SYS.busy)pushState().then(()=>{SYS.last=Date.now();ls.set('scpc.lastSync',SYS.last);setSync('Saved to Google Sheet','ok');}).catch(syncFail);},1500);}
}
async function api(action,payload,tries){
  tries=tries||3;
  for(let i=0;i<tries;i++){
    try{
      let r;
      try{r=await fetch(S(SY.url),{method:'POST',body:JSON.stringify(Object.assign({action,key:SY.key||''},payload||{}))});}
      catch(e){throw new Error('Cannot reach Google. Check the internet connection, and that the web app access is “Anyone”.');}
      const t=await r.text();let j;
      try{j=JSON.parse(t);}catch(e){throw new Error(r.ok?'Unexpected reply – check the Web app URL (it must end with /exec).':'Google returned error '+r.status);}
      if(!j.ok){const er=new Error(j.error||'Sync error');er.fatal=true;throw er;}
      return j;
    }catch(e){if(e.fatal||i===tries-1)throw e;await new Promise(res=>setTimeout(res,1500*(i+1)));}
  }
}
async function pushState(){await api('saveState',{state:{settings,done,at:stateAt}});}
function applyState(rs){
  const s=rs.settings||{};
  settings=Object.assign({},DEF,s);settings.pdt=Object.assign({},DEF.pdt,s.pdt||{});settings.map=Object.assign({price:{},soh:{},master:{}},s.map||{});
  ls.set('scpc.settings',settings);
  done=rs.done||{};ls.set('scpc.done',done);
  stateAt=rs.at||0;ls.set('scpc.stateAt',stateAt);
}
async function pushTable(id,target,headers,rows,label){
  const n=Math.max(1,headers.length),total=rows.length;
  await api('begin',{id,target,cols:n,rows:total,headers});
  const per=Math.max(300,Math.floor(50000/n));
  for(let s=0;s<total;s+=per){
    setSync(`Uploading ${label} … ${Math.round(s/Math.max(1,total)*100)}%`,'busy');
    const part=new Array(Math.min(per,total-s));
    for(let i=0;i<part.length;i++){const r=rows[s+i]||[],o=new Array(n);for(let j=0;j<n;j++){const v=r[j];o[j]=v==null?'':String(v);}part[i]=o;}
    await api('chunk',{id,target,cols:n,start:s,rows:part});
  }
}
async function pushKind(kind){
  const d=D[kind];if(!d)return;
  const id=String(Date.now()),label=KNAME[kind];
  await pushTable(id,kind,d.headers,d.rows,label);
  const meta={name:d.name,headers:d.headers,at:d.at,sheet:d.sheet,rows:d.rows.length};
  const targets=[kind];
  if(kind==='master'){await pushTable(id,'alias',['Barcode','Variant number'],d.alias||[],KNAME.alias);meta.aliasRows=(d.alias||[]).length;targets.push('alias');}
  setSync(`Saving ${label} …`,'busy');
  await api('commit',{id,kind,targets,meta});
}
async function readTable(target,total,cols,label){
  const per=Math.max(500,Math.floor(120000/Math.max(1,cols))),parts=[];
  for(let s=0;s<total;s+=per)parts.push(s);
  const out=new Array(parts.length);let doneN=0,next=0;
  const worker=async()=>{while(next<parts.length){const i=next++;
    const j=await api('read',{target,offset:parts[i],limit:per,cols});out[i]=j.rows;doneN++;
    setSync(`Downloading ${label} … ${Math.round(doneN/parts.length*100)}%`,'busy');}};
  await Promise.all([worker(),worker(),worker()]);
  return [].concat(...out);
}
async function pullKind(kind,m){
  setSync(`Downloading ${KNAME[kind]} …`,'busy');
  const rows=await readTable(kind,m.rows||0,m.headers.length,KNAME[kind]);
  const d={name:m.name,headers:m.headers,rows,at:m.at,sheet:m.sheet};
  if(kind==='master'){d.alias=(await readTable('alias',m.aliasRows||0,2,KNAME.alias)).map(r=>[S(r[0]),S(r[1])]).filter(r=>r[0]&&r[1]);MI=null;}
  D[kind]=d;await idbSet(kind,d);guessMap(kind,d.headers);
}
function fixStore(){if(D.soh){const whs=sohWarehouses();if(settings.store!=='*'&&!whs.includes(settings.store))settings.store=whs.includes('SCOGMR01')?'SCOGMR01':(whs.length===1?whs[0]:'*');}}
function syncFail(e){console.error(e);setSync('⚠ '+(e.message||e)+(SYS.last?'':' – working with the copy saved on this device.'),'err');}

/* mode: '' = two-way (newest wins), 'up' = send this device's data, 'down' = take everything from the Google Sheet */
async function syncNow(mode){
  if(!syncOn()){setSync('Enter the Web app URL first.','err');return;}
  if(SYS.busy){SYS.again=SYS.again||mode||'';return;}
  SYS.busy=true;setSync('Checking Google Sheet …','busy');
  let changed=false;
  try{
    const st=await api('status');
    const tomb=ls.get('scpc.tomb',{});
    // settings + done ticks
    const rs=st.state;
    if(mode==='up'){stateAt=Date.now();ls.set('scpc.stateAt',stateAt);await pushState();}
    else if(rs&&(mode==='down'||rs.at>stateAt)){applyState(rs);changed=true;}
    else if(stateAt>(rs?rs.at:0)||(!rs&&mode!=='down'))await pushState();
    // files
    for(const k of KINDS){
      const m=st.meta[k],rAt=m?m.at:0,lAt=D[k]?(D[k].at||1):(tomb[k]||0);
      if(mode==='up'){
        if(D[k]){D[k].at=Date.now();await idbSet(k,D[k]);await pushKind(k);}
        continue;
      }
      if(m&&(rAt>lAt||(mode==='down'&&rAt!==(D[k]&&D[k].at)))){
        if(m.removed){if(D[k]){D[k]=null;await idbDel(k);if(k==='master')MI=null;changed=true;}tomb[k]=m.at;}
        else{await pullKind(k,m);delete tomb[k];changed=true;}
      }else if(mode!=='down'&&lAt>rAt){
        if(D[k])await pushKind(k);
        else{await api('remove',{kind:k,at:lAt});}
      }
    }
    ls.set('scpc.tomb',tomb);
    SYS.last=Date.now();ls.set('scpc.lastSync',SYS.last);
    SYS.busy=false;
    setSync(changed?'Updated from Google Sheet ✓':'All synced ✓','ok');
  }catch(e){SYS.busy=false;syncFail(e);}
  if(changed){fixStore();refresh(true);}
  if(SYS.again!==undefined){const m=SYS.again;delete SYS.again;syncNow(m);}
}
function syncAfterLocalChange(){if(syncOn()&&SY.auto)syncNow();}

document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.sy;if(!k||k==='auto')return;SY[k]=e.target.value.trim();saveSY();renderSyncBtn();});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.sy;if(!k)return;if(k==='auto'){SY.auto=e.target.checked;saveSY();}else if(k==='url'&&syncOn())syncNow();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&syncOn()&&SY.auto&&Date.now()-SYS.last>60000)syncNow();});
setInterval(()=>{if(document.visibilityState==='visible'&&syncOn()&&SY.auto)syncNow();},300000);
const MASTER_KEEP=['VARIANT NUMBER','BARCODE','SEARCH NAME','PRODUCT NAME','BRAND','ITEM GROUP','PRODUCT','AGE GROUP','GENDER','SPORTS','COLLECTION','BUYER','ITEM MODEL GROUP','COUNTRY'];
const GMAP={'male':'Men','female':'Women','adult unisex':'Unisex','youth boys':'Boys','youth girls':'Girls','youth unisex':'Kids Unisex','infant boys':'Infant','infant girls':'Infant','infant unisex':'Infant'};

/* ================== data state ================== */
let D={price:null,soh:null,master:null};   // {name,headers,rows,at,...}
let MI=null, MODEL=null;
let F={status:'change',division:'',gender:'',brand:'',q:'',sort:'qty',dir:-1,page:0};
let SEL={q:'',res:null,sel:null,list:null};
let busy={};

function toTable(rows){
  let h=0;for(let i=0;i<Math.min(rows.length,15);i++){const r=rows[i];if(r&&r.filter(x=>S(x)!=='').length>=3){h=i;break;}}
  const headers=(rows[h]||[]).map(x=>S(x));const n=headers.length;const out=[];
  for(let i=h+1;i<rows.length;i++){const r=rows[i];if(!r)continue;let any=false;for(let j=0;j<n;j++){if(r[j]!=null&&r[j]!==''){any=true;break;}}if(any)out.push(r);}
  return {headers,rows:out};
}
function guessMap(kind,headers){
  const m=settings.map[kind]||{};const out={};
  for(const [f,label,re] of SCHEMA[kind].fields){
    if(m[f]&&headers.includes(m[f])){out[f]=m[f];continue;}
    out[f]=headers.find(h=>re.test(h))||'';
  }
  settings.map[kind]=out;
}
function missingFields(kind){
  const m=settings.map[kind],d=D[kind];if(!d)return[];
  return SCHEMA[kind].fields.filter(f=>/\*$/.test(f[1])&&(!m[f[0]]||!d.headers.includes(m[f[0]]))).map(f=>f[1].replace(' *',''));
}

/* ================== load files ================== */
let LQ=Promise.resolve();
function enqueue(kind,file){busy[kind]='Waiting …';renderSettings();LQ=LQ.then(()=>loadFile(kind,file));}
async function loadFile(kind,file){
  busy[kind]='Reading '+file.name+' …';renderSettings();await tick();
  try{
    const buf=await file.arrayBuffer();
    const wb=await readWorkbook(buf);
    const names=Object.keys(wb);
    if(kind==='master'){
      let main=null,alias=null;
      for(const n of names){const t=wb[n];const hdr=(t[0]||[]).map(x=>S(x).toUpperCase());
        if(hdr.includes('VARIANT NUMBER')&&hdr.includes('GENDER')) {if(!main||t.length>main.length) main=n;}
        else if(hdr.includes('BAR CODE')&&hdr.includes('VARIANT NUMBER')) alias=n;}
      if(!main) main=names.sort((a,b)=>wb[b].length-wb[a].length)[0];
      busy[kind]='Organising product master …';renderSettings();await tick();
      const t=toTable(wb[main]);
      const keepIdx=[],keepNames=[];t.headers.forEach((h,i)=>{if(MASTER_KEEP.includes(h.toUpperCase())){keepIdx.push(i);keepNames.push(h);}});
      const rows=new Array(t.rows.length);
      for(let i=0;i<t.rows.length;i++){const r=t.rows[i],o=new Array(keepIdx.length);for(let j=0;j<keepIdx.length;j++){const v=r[keepIdx[j]];o[j]=v==null?'':(typeof v==='number'?String(v):v);}rows[i]=o;}
      let al=[];
      if(alias){const a=toTable(wb[alias]);const bi=a.headers.findIndex(h=>/bar ?code$/i.test(h)),vi=a.headers.findIndex(h=>/variant/i.test(h));
        if(bi>=0&&vi>=0)for(const r of a.rows){const b=S(r[bi]),v=S(r[vi]);if(b&&v)al.push([b,v]);}}
      D.master={name:file.name,headers:keepNames,rows,alias:al,at:Date.now(),sheet:main};
    }else{
      const pick=names.sort((a,b)=>wb[b].length-wb[a].length)[0];
      const t=toTable(wb[pick]);D[kind]={name:file.name,headers:t.headers,rows:t.rows,at:Date.now(),sheet:pick};
    }
    guessMap(kind,D[kind].headers);
    if(kind==='soh'){const whs=sohWarehouses();if(settings.store!=='*'&&!whs.includes(settings.store))settings.store=whs.includes('SCOGMR01')?'SCOGMR01':(whs.length===1?whs[0]:'*');}
    delete busy[kind];saveSettings();
    busy[kind]='Saving in browser …';renderSettings();await tick();
    await idbSet(kind,D[kind]);delete busy[kind];
    refresh(true);syncAfterLocalChange();
  }catch(e){console.error(e);delete busy[kind];D[kind]=D[kind]||null;alert('Could not read '+file.name+'\n'+e.message);renderSettings();}
}
function sohWarehouses(){
  if(!D.soh)return[];const i=D.soh.headers.indexOf(settings.map.soh.wh);if(i<0)return[];
  const s=new Set();for(const r of D.soh.rows)s.add(S(r[i]));return [...s].filter(Boolean).sort();
}

/* ================== compute ================== */
function buildMasterIndex(){
  MI=null;const m=D.master;if(!m)return;
  const mp=settings.map.master,H=m.headers,ix=f=>H.indexOf(mp[f]);
  const iV=ix('variant'),iB=ix('barcode'),iA=ix('article'),iG=ix('gender'),iD=ix('division');
  const byVar=new Map(),byBar=new Map(),byArt=new Map(),canon=new Map(),alias=new Map();
  for(const r of m.rows){
    if(iV>=0&&r[iV])byVar.set(S(r[iV]),r);
    if(iB>=0&&r[iB])byBar.set(stripZ(r[iB]),r);
    if(iA>=0&&r[iA]){const k=norm(r[iA]);if(!byArt.has(k))byArt.set(k,r);}
    if(iD>=0){const v=S(r[iD]);if(v){const k=v.toLowerCase();const c=canon.get(k);if(!c||(c===c.toUpperCase()&&v!==v.toUpperCase()))canon.set(k,v);}}
  }
  for(const [b,v] of m.alias)alias.set(stripZ(b),v);
  MI={byVar,byBar,byArt,alias,iG,iD,canon};
}
const SZ_ORDER=['XXXS','XXS','XS','S','M','L','XL','XXL','2XL','XXXL','3XL','4XL','5XL'];
function sizeKey(v){const t=S(v).toUpperCase();const i=SZ_ORDER.indexOf(t);if(i>=0)return [0,i,t];const n=parseFloat(t.replace(',','.'));return isNaN(n)?[2,0,t]:[1,n,t];}
function compareSize(a,b){const x=sizeKey(a),y=sizeKey(b);return x[0]-y[0]||x[1]-y[1]||x[2].localeCompare(y[2]);}
function groupGender(raw){
  const v=S(raw);if(!v)return 'Unknown';
  return settings.genderGroup?(GMAP[v.toLowerCase()]||v):v;
}
function compute(){
  MODEL=null;if(!D.price||!D.soh)return;
  const pm=settings.map.price,ph=D.price.headers,pi=f=>ph.indexOf(pm[f]);
  const iA=pi('art'),iW=pi('was'),iN=pi('now'),iDe=pi('desc'),iBr=pi('brand');
  if(iA<0||iW<0||iN<0)return;
  const priceMap=new Map();
  for(const r of D.price.rows){const k=norm(r[iA]);if(!k)continue;priceMap.set(k,{art:S(r[iA]),was:num(r[iW]),now:num(r[iN]),desc:iDe>=0?S(r[iDe]):'',brand:iBr>=0?S(r[iBr]):''});}
  const sm=settings.map.soh,sh=D.soh.headers,si=f=>sh.indexOf(sm[f]);
  const xA=si('article'),xB=si('barcode'),xQ=si('qty'),xS=si('size'),xV=si('variant'),xW=si('wh'),xBr=si('brand'),xN=si('name');
  if(xA<0||xB<0||xQ<0)return;
  const agg=new Map();
  for(const r of D.soh.rows){
    const wh=xW>=0?S(r[xW]):'';
    if(settings.store!=='*'&&xW>=0&&wh!==settings.store)continue;
    const variant=xV>=0?S(r[xV]):'';const upc=S(r[xB]);const key=(variant||upc)+'|'+(settings.store==='*'?wh:'');
    let o=agg.get(key);
    if(!o){agg.set(key,o={upc,art:S(r[xA]),variant,size:xS>=0?S(r[xS]):'',qty:0,brand:xBr>=0?S(r[xBr]):'',name:xN>=0?S(r[xN]):'',wh});}
    o.qty+=num(r[xQ]);
  }
  const all=[];let unk=0;
  for(const o of agg.values()){
    let mr=null,tier='';
    if(MI){
      const bk=stripZ(o.upc);
      if(o.variant&&(mr=MI.byVar.get(o.variant)))tier='variant';
      else if((mr=MI.byBar.get(bk)))tier='barcode';
      else{const v=MI.alias.get(bk);if(v&&(mr=MI.byVar.get(v)))tier='alias';else if((mr=MI.byArt.get(norm(o.art))))tier='article';}
    }
    const p=priceMap.get(norm(o.art));
    let division='Unknown',genderRaw='';
    if(mr){const dv=MI.iD>=0?S(mr[MI.iD]):'';division=dv?(MI.canon.get(dv.toLowerCase())||dv):'Unknown';genderRaw=MI.iG>=0?S(mr[MI.iG]):'';}
    else unk++;
    all.push({upc:o.upc,art:o.art,variant:o.variant,size:o.size,qty:o.qty,brand:o.brand||(p&&p.brand)||'',name:o.name||(p&&p.desc)||'',
      division,gender:groupGender(genderRaw),genderRaw,hasPrice:!!p,was:p?p.was:0,now:p?p.now:0,tier,wh:o.wh});
  }
  const active=all.filter(r=>settings.includeZero||r.qty>0);
  const stockArts=new Set(all.map(r=>norm(r.art)));
  let priceNotInStock=0;for(const k of priceMap.keys())if(!stockArts.has(k))priceNotInStock++;
  const idx={bar:new Map(),art:new Map()};
  for(const r of all){idx.bar.set(stripZ(r.upc),r);const k=norm(r.art);(idx.art.get(k)||idx.art.set(k,[]).get(k)).push(r);}
  const artRows=[];
  for(const [k,p] of priceMap){
    const rs=(idx.art.get(k)||[]).filter(r=>settings.includeZero||r.qty>0);
    if(!rs.length)continue;               // only articles that exist in SOH
    const f=rs[0],sz=new Map();
    for(const r of rs){const z=r.size||'–';sz.set(z,(sz.get(z)||0)+r.qty);}
    const list=[...sz.entries()].sort((x,y)=>compareSize(x[0],y[0]));
    artRows.push({art:p.art,key:k,name:p.desc||f.name||'',brand:p.brand||f.brand||'',was:p.was,now:p.now,disc:p.was?Math.round((p.was-p.now)/p.was*100):0,
      qty:rs.reduce((a,r)=>a+r.qty,0),sizes:sz.size,sizeText:list.map(e=>e[0]+' ×'+fmt(e[1])).join(', '),division:f.division,gender:f.gender});
  }
  MODEL={all,active,priceMap,priceCount:priceMap.size,priceNotInStock,idx,unk,hasMaster:!!MI,artRows};
}
function refresh(full){
  if(full||!MI)buildMasterIndex();
  compute();renderAll();
}

/* ================== summaries ================== */
function summarize(rows,keyFn){
  const m=new Map();
  for(const r of rows){const k=keyFn(r);let o=m.get(k);
    if(!o)m.set(k,o={key:k,stockQty:0,qty:0,skus:0,arts:new Set(),was:0,now:0});
    o.stockQty+=r.qty;
    if(r.hasPrice){o.qty+=r.qty;o.skus++;o.arts.add(norm(r.art));o.was+=r.qty*r.was;o.now+=r.qty*r.now;}}
  return [...m.values()];
}
const fmt=n=>Math.round(n).toLocaleString('en-US');
const money=n=>(settings.decimals?Number(n).toLocaleString('en-US',{minimumFractionDigits:settings.decimals,maximumFractionDigits:settings.decimals}):fmt(n));
const pct=(a,b)=>b>0?Math.round(a/b*100):0;

function renderChip(){
  const c=$('#chipStore');

function stepsHtml(){

  return `<div class="steps">
   <div class="step"><div class="no">1</div><div><b>Upload files</b><span>${has('price')}Price list · ${has('soh')}Stock · ${has('master')}Product master (Settings tab)</span></div></div>

  const rows=MODEL.active,chg=rows.filter(r=>r.hasPrice);
  const stockQty=rows.reduce((a,r)=>a+r.qty,0),chgQty=chg.reduce((a,r)=>a+r.qty,0);
  const was=chg.reduce((a,r)=>a+r.qty*r.was,0),now=chg.reduce((a,r)=>a+r.qty*r.now,0);
  const arts=new Set(chg.map(r=>norm(r.art))).size;
  const unkQty=rows.filter(r=>r.division==='Unknown'||r.gender==='Unknown').reduce((a,r)=>a+r.qty,0);

  let h=stepsHtml();
  h+=`<div class="card"><div class="hero"><div>
    <div class="muted small" style="font-weight:700;text-transform:uppercase;letter-spacing:.5px">Pieces that need a new price tag</div>
    <div class="big">${fmt(chgQty)}</div>
    <div class="ink2" style="margin-top:6px">${pct(chgQty,stockQty)}% of the ${fmt(stockQty)} pieces in store · ${fmt(chg.length)} items (sizes) · ${fmt(arts)} articles</div></div>
    <div><div class="stack" role="img" aria-label="Change vs no change"><i style="width:${pct(chgQty,stockQty)}%;background:var(--accent)"></i><i style="flex:1;background:var(--neutral)"></i></div>

  h+=`<div class="grid g5" style="margin-bottom:16px">
    <div class="kpi"><div class="l">Value at old price (WAS)</div><div class="v">${money(was)}</div><div class="s">${cur}</div></div>
    <div class="kpi"><div class="l">Value at new price (NOW)</div><div class="v">${money(now)}</div><div class="s">${cur}</div></div>

    <div class="kpi"><div class="l">Avg reduction per piece</div><div class="v">${chgQty?money((was-now)/chgQty):0}</div><div class="s">${cur} per piece</div></div></div>`;
  if(!MODEL.hasMaster)h+=`<div class="warn" style="margin-bottom:16px">Product master not loaded – division and gender show as “Unknown”. Upload it in Settings.</div>`;

function breakdownCard(title,dim,chg,rows){
  const sum=summarize(rows,r=>r[dim]).filter(o=>o.qty>0||o.stockQty>0).sort((a,b)=>b.qty-a.qty||b.stockQty-a.stockQty);
  const max=Math.max(1,...sum.map(o=>o.qty));const cur=esc(settings.currency);
  const nDone=sum.filter(o=>o.qty>0&&done[dim+'|'+o.key]).length,nTodo=sum.filter(o=>o.qty>0).length;
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>${title}-wise price change</h2><p class="hint" style="margin:0">Tick “Done” once a ${title.toLowerCase()} has been re-tagged. Click a name to see its items.</p></div>
   <div class="pill ${nDone===nTodo&&nTodo?'chg':'no'}">${nDone} of ${nTodo} done</div></div><div class="scroll" style="margin-top:10px"><table><thead><tr><th>${title}</th><th>Qty to change</th><th class="n">Items</th><th class="n">Articles</th><th class="n">Qty in stock</th><th class="n">% changing</th><th class="n">Avg disc.</th><th class="n">Reduction (${cur})</th><th>Done</th><th></th></tr></thead><tbody>`;
  for(const o of sum){

     <td><div class="bar" data-tip="${fmt(o.qty)} pieces to change"><i style="width:${o.qty/max*100}%"></i><b>${fmt(o.qty)}</b></div></td>
     <td class="n">${fmt(o.skus)}</td><td class="n">${fmt(o.arts.size)}</td><td class="n">${fmt(o.stockQty)}</td><td class="n">${pct(o.qty,o.stockQty)}%</td>
     <td class="n">${o.qty?d+'%':'–'}</td><td class="n">${o.qty?money(o.was-o.now):'–'}</td>
     <td>${o.qty?`<input type="checkbox" data-done="${esc(k)}" ${done[k]?'checked':''} aria-label="Done">`:''}</td>
     <td>${o.qty?`<button class="btn alt sm" data-act="pdt" data-dim="${dim}" data-val="${esc(o.key)}">⬇ PDT file</button>`:''}</td></tr>`;}
  const tq=sum.reduce((a,o)=>a+o.qty,0),ts=sum.reduce((a,o)=>a+o.stockQty,0),tw=sum.reduce((a,o)=>a+o.was,0),tn=sum.reduce((a,o)=>a+o.now,0);
  h+=`</tbody><tfoot><tr><td><b>Total</b></td><td><b>${fmt(tq)}</b></td><td class="n"><b>${fmt(sum.reduce((a,o)=>a+o.skus,0))}</b></td><td></td><td class="n"><b>${fmt(ts)}</b></td><td class="n"><b>${pct(tq,ts)}%</b></td><td class="n"><b>${tw>0?Math.round((tw-tn)/tw*100):0}%</b></td><td class="n"><b>${money(tw-tn)}</b></td><td></td><td></td></tr></tfoot></table></div></div>`;
  return h;
}
function noChangeCard(rows){

    const m=new Map(),st=new Map();

    const s=[...m.values()].sort((a,b)=>b.qty-a.qty);const max=Math.max(1,...s.map(o=>o.qty));

      <td><div class="bar" data-tip="${fmt(o.qty)} pieces keep current price"><i style="width:${o.qty/max*100}%;background:var(--muted)"></i><b>${fmt(o.qty)}</b></div></td>
      <td class="n">${fmt(o.skus)}</td><td class="n">${fmt(o.arts.size)}</td><td class="n">${pct(o.qty,st.get(o.key)||0)}%</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nothing here – every item in store has a price change.</td></tr>')+
    `</tbody><tfoot><tr><td><b>Total</b></td><td><b>${fmt(tq)}</b></td><td class="n"><b>${fmt(s.reduce((a,o)=>a+o.skus,0))}</b></td><td></td><td class="n"><b>${pct(tq,stockQty)}%</b></td></tr></tfoot></table></div>`;
  };
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><h2>No price change report</h2><p class="hint" style="margin:0">Pieces in store that are NOT on the price list – keep their current tag. Click a name to see its items.</p></div>
    <div class="row"><button class="btn alt sm" data-act="drill" data-status="no" data-dim="division" data-val="">View all</button><button class="btn alt sm" data-act="exportNo" ${nc.length?'':'disabled'}>⬇ Full list (CSV)</button></div></div>

const DELIMS={',':',',';':';','tab':'\t','|':'|'};
function fmtUpc(u){const p=settings.pdt.upc;if(p==='strip')return stripZ(u)||u;if(p==='pad13')return (S(u).replace(/\D/g,'')).padStart(13,'0');return S(u);}
function pdtLines(rows,limit){
  const P=settings.pdt,d=DELIMS[P.delim]||',';const q=v=>{v=String(v==null?'':v);return(v.includes(d)||/["\n\r]/.test(v))?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=['UPC','Article','WAS','NOW','Qty','Size'].concat(P.extra?['Description','Brand','Division','Gender']:[]);
  const out=[];if(P.header)out.push(head.map(q).join(d));
  const seen=new Set();let n=0;
  for(const r of rows){
    if(!r.hasPrice&&!P.includeNoPrice)continue;
    const u=fmtUpc(r.upc);if(seen.has(u))continue;seen.add(u);
    const a=[u,r.art,r.hasPrice?r.was:'',r.hasPrice?r.now:'',r.qty,r.size];
    if(P.extra)a.push(r.name,r.brand,r.division,r.gender);
    out.push(a.map(q).join(d));n++;if(limit&&out.length>=limit)break;
  }
  return {lines:out,count:limit?null:n};
}
function download(name,text,mime,bom){
  const blob=new Blob([bom?'﻿'+text:text],{type:mime||'text/plain'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function exportPdt(rows,tag){
  const P=settings.pdt;const r=pdtLines(rows);
  if(!r.count){alert('Nothing to export for this selection.');return;}
  const eol=P.eol==='lf'?'\n':'\r\n';const day=new Date().toISOString().slice(0,10);
  download(`PDT_${(tag||'PriceCheck').replace(/[^\w-]+/g,'_')}_${settings.store==='*'?'ALL':settings.store}_${day}.${P.ext}`,r.lines.join(eol)+eol,'text/plain');
}
function exportFull(rows){
  const q=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=['UPC','Article','Description','Brand','Size','Qty','WAS','NOW','Discount %','Division','Gender (master)','Gender (group)','Price change?'];
  const lines=[head.join(',')];
  for(const r of rows)lines.push([r.upc,r.art,r.name,r.brand,r.size,r.qty,r.hasPrice?r.was:'',r.hasPrice?r.now:'',r.hasPrice&&r.was?Math.round((r.was-r.now)/r.was*100):'',r.division,r.genderRaw,r.gender,r.hasPrice?'YES':'NO'].map(q).join(','));
  download('Stock_with_price_change_'+new Date().toISOString().slice(0,10)+'.csv',lines.join('\r\n'),'text/csv',true);
}

  let h=syncCardHtml()+`<div class="card"><h2>1 · Upload your files</h2><p class="hint">Excel files (.xlsx or .xlsb) are read inside your browser and remembered on this device. If Google Sheets sync is set up, they are also saved to your Google Sheet so other devices get them.</p>
   <div class="grid g3">${fileCard('price','Price list','Article, WAS and NOW prices (Special offer list)','.xlsx,.xlsb')}
   ${fileCard('soh','Stock on hand (SOH)','Barcode, article, size and quantity per store','.xlsx,.xlsb')}
   ${fileCard('master','Product master','Gives gender and division for every item (large file – takes a few seconds)','.xlsx,.xlsb')}</div></div>`;
  h+=`<div class="card"><h2>2 · Store &amp; grouping</h2><div class="grid g4">
    <div><label class="f">Store / warehouse</label><select data-s="store"><option value="*" ${settings.store==='*'?'selected':''}>All stores in file</option>${whs.map(w=>`<option ${w===settings.store?'selected':''}>${esc(w)}</option>`).join('')}</select><div class="small muted">The SOH file can hold many stores – pick yours (SCOGMR01 = Gulf Mall Outlet).</div></div>
    <div><label class="f">Division comes from (product master column)</label><select data-m="master.division">${D.master?D.master.headers.map(x=>`<option ${x===settings.map.master.division?'selected':''}>${esc(x)}</option>`).join(''):'<option>ITEM GROUP</option>'}</select><div class="small muted">ITEM GROUP = Apparel / Footwear / Accessory… Try PRODUCT for T-Shirt, Shorts…</div></div>
    <div><label class="f">Gender names</label><select data-s="genderGroup"><option value="1" ${settings.genderGroup?'selected':''}>Simple – Men, Women, Boys, Girls…</option><option value="0" ${!settings.genderGroup?'selected':''}>As in product master</option></select></div>
    <div><label class="f">Stock to include</label><select data-s="includeZero"><option value="0" ${!settings.includeZero?'selected':''}>Only items with stock (qty &gt; 0)</option><option value="1" ${settings.includeZero?'selected':''}>Include zero-stock items</option></select></div></div></div>`;
  h+=`<div class="card"><h2>3 · Honeywell PDT file</h2><p class="hint">Layout of the file you load into the PDT. Columns are always: UPC, Article, WAS, NOW, Qty, Size.</p><div class="grid g4">
    <div><label class="f">Separator</label><select data-p="delim">${[[',','Comma ( , )'],[';','Semicolon ( ; )'],['tab','Tab'],['|','Pipe ( | )']].map(x=>`<option value="${x[0]}" ${P.delim===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
    <div><label class="f">File type</label><select data-p="ext"><option value="csv" ${P.ext==='csv'?'selected':''}>.csv</option><option value="txt" ${P.ext==='txt'?'selected':''}>.txt</option></select></div>
    <div><label class="f">Line ending</label><select data-p="eol"><option value="crlf" ${P.eol==='crlf'?'selected':''}>Windows (CRLF)</option><option value="lf" ${P.eol==='lf'?'selected':''}>Unix (LF)</option></select></div>
    <div><label class="f">UPC format</label><select data-p="upc"><option value="asis" ${P.upc==='asis'?'selected':''}>As in stock file</option><option value="strip" ${P.upc==='strip'?'selected':''}>Remove leading zeros</option><option value="pad13" ${P.upc==='pad13'?'selected':''}>Pad to 13 digits</option></select></div>
    <div class="tg"><input type="checkbox" id="pHeader" data-p="header" ${P.header?'checked':''}><label for="pHeader">First line = column titles</label></div>
    <div class="tg"><input type="checkbox" id="pNoPrice" data-p="includeNoPrice" ${P.includeNoPrice?'checked':''}><label for="pNoPrice">Also include items with no price change (blank WAS/NOW)</label></div>
    <div class="tg"><input type="checkbox" id="pExtra" data-p="extra" ${P.extra?'checked':''}><label for="pExtra">Add Description, Brand, Division, Gender columns</label></div></div>
    <div class="small muted" style="margin-top:10px">Preview of the first lines:</div><pre class="prev" id="pdtPrev">${MODEL?esc(pdtLines(MODEL.active.filter(r=>r.hasPrice),4).lines.join('\n')||'(no price-change items)'):'Upload files to see a preview'}</pre></div>`;
  h+=`<div class="card"><h2>4 · Display</h2><div class="grid g4"><div><label class="f">Currency label</label><input type="text" data-s="currency" value="${esc(settings.currency)}"></div>
   <div><label class="f">Decimals for money totals</label><select data-s="decimals"><option value="0" ${!settings.decimals?'selected':''}>0</option><option value="2" ${settings.decimals?'selected':''}>2</option></select></div></div></div>`;
  h+=`<div class="card"><details><summary>Advanced – column mapping</summary><p class="hint" style="margin-top:8px">Columns are found automatically from the header names. Change them here only if a file has a different layout.</p>`;
  for(const kind of ['price','soh','master']){
    if(!D[kind]){h+=`<h3 style="margin:14px 0 4px">${SCHEMA[kind].title}</h3><div class="muted small">Upload the file first.</div>`;continue;}
    h+=`<h3 style="margin:14px 0 6px">${SCHEMA[kind].title}</h3><div class="grid g4">`;

      if(kind==='master'&&f==='division')continue;
      h+=`<div><label class="f">${esc(label)}</label><select data-m="${kind}.${f}"><option value="">— none —</option>${D[kind].headers.filter(Boolean).map(x=>`<option ${x===settings.map[kind][f]?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;}
    h+=`</div>`;}
  h+=`</details></div>

  el.innerHTML=h;
}

/* ================== wiring ================== */
let tabNow='dash';
function go(t){
  tabNow=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  for(const k of ['dash','check','list','art','set'])$('#tab-'+k).hidden=k!==t;
  window.scrollTo(0,0);if(t==='check')renderCheck();if(t==='list')renderListTab();if(t==='art')renderArt();
}
function renderAll(){renderChip();renderDash();renderSettings();renderArt();if(tabNow==='check'||$('#tab-check').innerHTML)renderCheck();if(tabNow==='list'||$('#tab-list').innerHTML)renderListTab();}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-go],[data-act],[data-sort],[data-pg],[data-asort],[data-apg],[data-arow],[data-size],[data-pick],[data-row],[data-clear],#scanBtn,#resetAll');if(!t)return;
  if(t.dataset.tab)return go(t.dataset.tab);
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.sort){F.dir=F.sort===t.dataset.sort?-F.dir:1;F.sort=t.dataset.sort;return renderList();}
  if(t.dataset.pg){F.page+=+t.dataset.pg;return renderList();}
  if(t.dataset.size){const r=SEL.res.find(x=>x.upc===t.dataset.size);if(r){SEL.sel=r;renderResult();}return;}
  if(t.dataset.pick){doLookup(t.dataset.pick);return;}
  if(t.dataset.row){go('check');const inp=$('#scan');inp.value=t.dataset.row;doLookup(t.dataset.row);return;}
  if(t.dataset.clear){const k=t.dataset.clear;D[k]=null;idbDel(k);if(k==='master')MI=null;const tb=ls.get('scpc.tomb',{});tb[k]=Date.now();ls.set('scpc.tomb',tb);refresh(true);syncAfterLocalChange();return;}
  if(t.id==='scanBtn'){const i=$('#scan');doLookup(i.value);i.select();return;}
  if(t.id==='resetAll'){if(confirm('Remove saved files and settings?')){try{localStorage.clear();ls.set('scpc.sync',SY);}catch(e){}['price','soh','master'].forEach(idbDel);setTimeout(()=>location.reload(),300);}return;}
  if(t.dataset.asort){A.dir=A.sort===t.dataset.asort?-A.dir:1;A.sort=t.dataset.asort;return renderArtList();}
  if(t.dataset.apg){A.page+=+t.dataset.apg;return renderArtList();}
  if(t.dataset.arow){go('check');const i=$('#scan');if(i)i.value=t.dataset.arow;doLookup(t.dataset.arow);return;}
  const a=t.dataset.act;
  if(a==='drill'){F={status:t.dataset.status||'change',division:'',gender:'',brand:'',q:'',sort:'qty',dir:-1,page:0};F[t.dataset.dim]=t.dataset.val;if(t.dataset.dim2)F[t.dataset.dim2]=t.dataset.val2;go('list');return;}
  if(a==='pdt'){exportPdt(rowsFor(t.dataset.dim,t.dataset.val),t.dataset.val);return;}
  if(a==='exportList'){exportPdt(filteredRows(),[F.division,F.gender,F.brand].filter(Boolean).join('_')||'PriceChange');return;}
  if(a==='exportNo'){exportFull(MODEL.active.filter(r=>!r.hasPrice));return;}
  if(a==='exportArt'){exportArt(artFiltered());return;}
  if(a==='exportFull'){exportFull(filteredRows());return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.file){const f=t.files[0];if(f)enqueue(t.dataset.file,f);t.value='';return;}
  if(t.dataset.done){done[t.dataset.done]=t.checked;ls.set('scpc.done',done);markState();renderDash();return;}
  if(t.dataset.af){A[t.dataset.af]=t.value;A.page=0;return renderArtList();}
  if(t.dataset.f){F[t.dataset.f]=t.value;F.page=0;return renderList();}
  if(t.dataset.s){let v=t.value;const k=t.dataset.s;if(k==='genderGroup'||k==='includeZero')v=v==='1';if(k==='decimals')v=+v;settings[k]=v;saveSettings();refresh(false);return;}
  if(t.dataset.p){settings.pdt[t.dataset.p]=t.type==='checkbox'?t.checked:t.value;saveSettings();renderSettings();if(MODEL&&tabNow==='list')renderList();return;}
  if(t.dataset.m){const [k,f]=t.dataset.m.split('.');settings.map[k][f]=t.value;saveSettings();refresh(k==='master');return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='ftext'){F.q=e.target.value;F.page=0;clearTimeout(window._ft);window._ft=setTimeout(renderList,200);}
  if(e.target.id==='atext'){A.q=e.target.value;A.page=0;clearTimeout(window._at);window._at=setTimeout(renderArtList,200);}
  if(e.target.dataset.s==='currency'){settings.currency=e.target.value;saveSettings();renderDash();}
});
document.addEventListener('keydown',e=>{if(e.target.id==='scan'&&e.key==='Enter'){e.preventDefault();doLookup(e.target.value);e.target.select();}});
/* drag & drop */
document.addEventListener('dragover',e=>{const d=e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('[data-drop]');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest('[data-drop]');e.preventDefault();if(d){d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)enqueue(d.dataset.drop,f);}});
/* tooltip */
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t){tip.textContent=t.dataset.tip;tip.style.display='block';}});
document.addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+14,innerWidth-270)+'px';tip.style.top=(e.clientY+16)+'px';}});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none';});
/* theme */
(function(){const t=ls.get('scpc.theme',null);if(t)document.documentElement.dataset.theme=t;
 $('#themeBtn').onclick=()=>{const dark=(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';const n=dark?'light':'dark';document.documentElement.dataset.theme=n;ls.set('scpc.theme',n);};})();

function buildDeck(pptx){
  const rows=MODEL.active,chg=rows.filter(r=>r.hasPrice),nc=rows.filter(r=>!r.hasPrice);
  const cur=settings.currency;
  const storeName=settings.store==='SCOGMR01'?'Gulf Mall Outlet':(settings.store==='*'?'All stores':settings.store);
  const stockQty=rows.reduce((a,r)=>a+r.qty,0),chgQty=chg.reduce((a,r)=>a+r.qty,0),ncQty=nc.reduce((a,r)=>a+r.qty,0);
  const was=chg.reduce((a,r)=>a+r.qty*r.was,0),now=chg.reduce((a,r)=>a+r.qty*r.now,0);
  const arts=new Set(chg.map(r=>norm(r.art))).size;
  const avgDisc=was>0?Math.round((was-now)/was*100):0;
  // template palette
  const NAVY='0B1F4B',BG='F3F6FC',BLUE='1F4FD8',RED='D6293E',INK='1A1A2E',GREY='6B7280',BODY='4A5068',LINE='DDE3F0',ALT='EEF2FA',SUBT='CADCFC';
  pptx.layout='LAYOUT_WIDE';pptx.title='Price Change Preparation – '+storeName;
  pptx.defineSlideMaster({title:'M',background:{color:BG},
    objects:[{rect:{x:0,y:0,w:13.333,h:1.267,fill:{color:NAVY}}},{image:{x:0.667,y:6.894,w:1.183,h:0.267,data:SC_LOGO}}],
    slideNumber:{x:12.0,y:6.894,w:0.667,h:0.267,fontFace:'Calibri',fontSize:12,color:GREY,align:'right'}});
  const slide=(title,sub)=>{const s=pptx.addSlide({masterName:'M'});
    s.addText(title,{x:0.667,y:0.1,w:12,h:0.68,fontFace:'Calibri',fontSize:22,bold:true,color:'FFFFFF',valign:'bottom',margin:0,fit:'shrink'});
    if(sub)s.addText(sub,{x:0.667,y:0.8,w:12,h:0.33,fontFace:'Calibri',fontSize:13,color:SUBT,valign:'top',margin:0,fit:'shrink'});return s;};
  const shadow=()=>({type:'outer',color:NAVY,opacity:0.12,blur:6,offset:1,angle:90});
  const card=(s,x,y,w,h)=>s.addShape(pptx.ShapeType.roundRect,{x,y,w,h,fill:{color:'FFFFFF'},line:{color:LINE,width:0.75},rectRadius:0.1,shadow:shadow()});
  const kpi=(s,x,y,w,h,label,val,sub,col)=>{card(s,x,y,w,h);
    s.addText(label.toUpperCase(),{x:x+0.15,y:y+0.1,w:w-0.3,h:0.25,fontFace:'Calibri',fontSize:10,bold:true,color:GREY,charSpacing:1,margin:0,valign:'middle'});
    s.addText(String(val),{x:x+0.15,y:y+0.37,w:w-0.3,h:0.45,fontFace:'Calibri',fontSize:26,bold:true,color:col||NAVY,margin:0,valign:'middle',fit:'shrink'});
    if(sub)s.addText(sub,{x:x+0.15,y:y+0.85,w:w-0.3,h:h-0.9,fontFace:'Calibri',fontSize:10.5,color:BODY,margin:0,valign:'top',fit:'shrink'});};
  const label=(s,t,x,y,w)=>s.addText(t,{x,y,w,h:0.3,fontFace:'Calibri',fontSize:14,bold:true,color:INK,margin:0,valign:'middle'});
  const table=(s,head,body,colW,x,y,rowH)=>{
    const o=(extra)=>Object.assign({fontFace:'Calibri',fontSize:10.5,color:INK,border:{type:'solid',color:LINE,pt:0.5},margin:[0.02,0.08,0.02,0.08],valign:'middle'},extra);
    const H=head.map((t,j)=>({text:t,options:o({bold:true,color:'FFFFFF',fill:{color:NAVY},align:(j===0||(body[0]&&!/^[\d.,%\s\-–]*$/.test(String(body[0][j]))))?'left':'right'})}));
    const B=body.map((r,i)=>r.map((c,j)=>({text:String(c),options:o({bold:!!r.total,fill:{color:r.total?'DCE5F7':(i%2?ALT:'FFFFFF')},align:(j===0||!/^[\d.,%\s\-–]*$/.test(String(c)))?'left':'right'})})));
    s.addTable([H].concat(B),{x,y,w:colW.reduce((a,b)=>a+b,0),colW,rowH:rowH||0.4});};
  const bar=(s,x,y,w,h,labels,values,color,dir,fmtCode)=>{
    card(s,x,y,w,h);
    if(!labels.length)return;
    s.addChart(pptx.charts.BAR,[{name:'Pieces',labels,values}],{x:x+0.1,y:y+0.1,w:w-0.2,h:h-0.2,barDir:dir||'bar',chartColors:[color||BLUE],barGapWidthPct:40,
      catAxisOrientation:dir==='col'?'minMax':'maxMin',showValue:true,dataLabelFontFace:'Calibri',dataLabelFontSize:10.5,dataLabelColor:INK,dataLabelFormatCode:fmtCode||'#,##0',
      catAxisLabelFontFace:'Calibri',catAxisLabelFontSize:10.5,catAxisLabelColor:INK,valAxisHidden:true,valGridLine:{style:'none'},catGridLine:{style:'none'},showLegend:false});};
  const groups=(rs,dim)=>summarize(rs,r=>r[dim]).filter(o=>o.qty>0).sort((a,b)=>b.qty-a.qty);
  const dimTable=(s,first,g,x,y,w,n)=>{
    const tq=g.reduce((a,o)=>a+o.qty,0),tr=g.reduce((a,o)=>a+o.was-o.now,0);
    const body=g.slice(0,n).map(o=>[o.key,fmt(o.qty),pct(o.qty,tq)+'%',(o.was>0?Math.round((o.was-o.now)/o.was*100):0)+'%',money(o.was-o.now)]);
    const t=['Total',fmt(tq),'100%',avgDisc+'%',money(tr)];t.total=true;body.push(t);
    const c=[w*0.31,w*0.2,w*0.14,w*0.15,w*0.2];
    table(s,[first,'Qty to change','Share','Avg disc.','Reduction ('+cur+')'],body,c,x,y,0.4);};

  const gDiv=groups(chg,'division'),gGen=groups(chg,'gender'),gBr=groups(chg.map(r=>Object.assign({},r,{brand:r.brand||'—'})),'brand');
  // 1 title
  let s=pptx.addSlide();s.background={color:NAVY};
  s.addImage({data:SC_COVER,x:8.4,y:0,w:4.933,h:7.5});
  s.addText('SC '+storeName+' Price Change Preparation',{x:0.8,y:2.0,w:7.2,h:3.5,fontFace:'Calibri',fontSize:48,bold:true,color:'FFFFFF',valign:'middle',margin:0,fit:'shrink'});
  // 2 headline
  s=slide(fmt(chgQty)+' pieces need a new price tag',`${pct(chgQty,stockQty)}% of the ${fmt(stockQty)} pieces in store · prices in ${cur}`);
  const X=[0.6,3.675,6.75,9.825],W=2.925;
  [['Pieces to change',fmt(chgQty),pct(chgQty,stockQty)+'% of store stock'],['Items (sizes)',fmt(chg.length),'distinct UPCs'],['Articles',fmt(arts),'on the price list and in store'],['Stock in store',fmt(stockQty),'pieces']].forEach((k,i)=>kpi(s,X[i],1.5,W,1.3,k[0],k[1],k[2]));
  [['Value at old price (WAS)',money(was),cur],['Value at new price (NOW)',money(now),cur],['Price reduction',money(was-now),cur+' on current stock'],['Average discount',avgDisc+'%','value-weighted']].forEach((k,i)=>kpi(s,X[i],2.95,W,1.3,k[0],k[1],k[2]));
  s.addText('Key points',{x:0.6,y:4.5,w:6,h:0.4,fontFace:'Calibri',fontSize:16,bold:true,color:INK,margin:0,valign:'middle'});
  const kp=[];
  if(gDiv[0])kp.push(`${gDiv[0].key} has the most pieces to change (${fmt(gDiv[0].qty)}, ${pct(gDiv[0].qty,chgQty)}% of the total).`);
  if(gGen[0]&&gBr[0])kp.push(`${gGen[0].key} is the largest gender group (${pct(gGen[0].qty,chgQty)}%); ${gBr[0].key} is the largest brand (${pct(gBr[0].qty,chgQty)}%).`);
  kp.push(`Average discount is ${avgDisc}%: a total price reduction of ${money(was-now)} ${cur} on current stock.`);
  kp.push(`${fmt(ncQty)} pieces (${pct(ncQty,stockQty)}% of store stock) have no price change and keep their current tag.`);
  s.addText(kp.map((t,i)=>({text:t,options:{bullet:true,breakLine:i<kp.length-1,paraSpaceAfter:10}})),{x:0.6,y:4.95,w:12.1,h:1.8,fontFace:'Calibri',fontSize:16,color:BODY,valign:'top',margin:0,fit:'shrink'});
  // 3 division
  s=slide(gDiv[0]?`${gDiv[0].key} leads with ${pct(gDiv[0].qty,chgQty)}% of the pieces to change`:'Division-wise price change','Pieces to re-tag by division');
  bar(s,0.5,1.5,5.6,5.2,gDiv.slice(0,12).map(o=>o.key),gDiv.slice(0,12).map(o=>o.qty));
  dimTable(s,'Division',gDiv,6.3,1.55,6.45,12);
  // 4 gender
  s=slide(gGen[0]?`${gGen[0].key} is the largest gender group at ${pct(gGen[0].qty,chgQty)}%`:'Gender-wise price change','Pieces to re-tag by gender');
  bar(s,0.5,1.5,4.8,5.2,gGen.slice(0,12).map(o=>o.key),gGen.slice(0,12).map(o=>o.qty));
  dimTable(s,'Gender',gGen,5.5,1.55,7.25,12);
  // 5 brands
  const top10=gBr.slice(0,10),t10=top10.reduce((a,o)=>a+o.qty,0);
  s=slide(`The top ${top10.length} brands carry ${pct(t10,chgQty)}% of the price change`,'Brand contribution to pieces needing a new tag');
  bar(s,0.5,1.5,5.6,5.2,top10.map(o=>o.key),top10.map(o=>o.qty));
  dimTable(s,'Brand',gBr,6.3,1.55,6.45,10);
  // 6 discount depth
  const bands=[[0,29,'20–29%'],[30,39,'30–39%'],[40,49,'40–49%'],[50,59,'50–59%'],[60,69,'60–69%'],[70,79,'70–79%'],[80,100,'80%+']];
  const bandV=bands.map(()=>0);
  for(const r of chg){const d=r.was>0?(r.was-r.now)/r.was*100:0;const i=bands.findIndex(b=>d<=b[1]+.999);bandV[i<0?bands.length-1:i]+=r.qty;}
  const bi=bandV.indexOf(Math.max(...bandV));
  s=slide(`Most pieces are marked down ${bands[bi][2]}`,'Pieces by discount band (WAS → NOW)');
  bar(s,0.5,1.5,12.3,5.2,bands.map(b=>b[2]),bandV,BLUE,'col');
  // 7 top articles
  const ta=MODEL.artRows.slice().sort((a,b)=>b.qty-a.qty).slice(0,12);
  s=slide('Top articles to re-price','Price-list articles in store stock, by quantity · prices in '+cur);
  table(s,['Article','Description','Brand','WAS','NOW','Disc.','Sizes','Qty'],ta.map(r=>[r.art,(r.name||'').slice(0,38),(r.brand||'').slice(0,18),r.was,r.now,r.disc+'%',r.sizes,fmt(r.qty)]),[1.7,4.3,1.9,0.9,0.9,0.8,0.8,0.8],0.6,1.55,0.4);
  // 8 no change
  const gNc=summarize(nc,r=>r.division).filter(o=>o.stockQty>0).sort((a,b)=>b.stockQty-a.stockQty);
  s=slide(`${fmt(ncQty)} pieces keep their current price`,'Items in store that are not on the price list – no re-tagging needed');
  [['Pieces – no change',fmt(ncQty),pct(ncQty,stockQty)+'% of store stock'],['Items (sizes)',fmt(nc.length),'distinct UPCs'],['Articles',fmt(new Set(nc.map(r=>norm(r.art))).size),'not on the price list'],['Brands',fmt(new Set(nc.map(r=>r.brand).filter(Boolean)).size),'with no change']].forEach((k,i)=>kpi(s,X[i],1.5,W,1.2,k[0],k[1],k[2]));
  bar(s,0.5,2.9,5.6,3.85,gNc.slice(0,8).map(o=>o.key),gNc.slice(0,8).map(o=>o.stockQty),'9AA7C7');
  const tNc=gNc.reduce((a,o)=>a+o.stockQty,0);
  const nb=gNc.slice(0,8).map(o=>[o.key,fmt(o.stockQty),fmt(nc.filter(r=>r.division===o.key).length),pct(o.stockQty,tNc)+'%']);
  const nt=['Total',fmt(tNc),fmt(nc.length),'100%'];nt.total=true;nb.push(nt);
  table(s,['Division','Qty – no change','Items','Share'],nb,[2.4,1.7,1.2,1.15],6.3,2.95,0.38);
  // 9 next steps
  s=slide('Next steps','From price list to re-tagged shelf');
  const steps=['Download the PDT file per division from the dashboard.','Load the file into the Honeywell PDT.','Scan each item in Price Check to confirm WAS → NOW.','Re-tag the pieces and tick “Done” for the division.','Leave the no-change items with their current tag.'];
  s.addText(steps.map((t,i)=>({text:t,options:{bullet:{type:'number'},breakLine:i<steps.length-1,paraSpaceAfter:14}})),{x:0.6,y:1.6,w:12.1,h:4.8,fontFace:'Calibri',fontSize:18,color:BODY,valign:'top',margin:0});
}
/*PPT_END*/
async function exportPpt(){
  if(!MODEL){alert('Upload the price list and stock files first (Settings tab).');return;}
  const b=$('#pptBtn'),old=b.textContent;b.disabled=true;b.textContent='⏳ Building …';
  try{
    if(!window.PptxGenJS)await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';sc.onload=res;sc.onerror=()=>rej(new Error('Could not load the PowerPoint library. Please check your internet connection and try again.'));document.head.appendChild(sc);});
    const p=new window.PptxGenJS();buildDeck(p);
    await p.writeFile({fileName:'SportsCorner_PriceChange_'+(settings.store==='*'?'ALL':settings.store)+'_'+new Date().toISOString().slice(0,10)+'.pptx'});
  }catch(e){console.error(e);alert(e.message||e);}
  b.disabled=false;b.textContent=old;
}
document.addEventListener('click',e=>{if(e.target.closest('#pptBtn'))exportPpt();});
